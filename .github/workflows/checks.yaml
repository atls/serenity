name: Checks

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    paths:
      - '**'
      - '!.agents/**'
      - '!.codex/context/**'
      - '!**/*.md'
      - '!.github/assets/**'
      - '**/src/**'
      - '**/test*/**'
      - '**/__tests__/**'
      - '**/*fixtures*/**'
      - '**/templates/**'

jobs:
  check:
    name: Checks
    uses: atls/shared/.github/workflows/checks.yaml@master
    permissions: write-all
    with:
      installPlaywright: false
